# Always Best Care provider portal
# Versions Stripe Connect Edge Functions for hosted project uwgfitnpesgdkiwtekcb.
# Stripe mode follows STRIPE_SECRET_KEY (sk_live_ vs sk_test_).

project_id = "uwgfitnpesgdkiwtekcb"

[functions.create-connected-account]
verify_jwt = true

[functions.create-account-link]
verify_jwt = true

[functions.sync-connect-status]
verify_jwt = true

[functions.stripe-connect-webhook]
verify_jwt = false

# Mobile BookingScreen sends the anon JWT, not a provider user JWT.
[functions.charge-client]
verify_jwt = false

# AdminApplications sends the admin user JWT. The function checks admin role itself.
[functions.notify-provider-status]
verify_jwt = false

# Register.tsx sends the anon JWT after paid signup. The function emails the agreement via Resend.
[functions.submit-provider-application]
verify_jwt = false
