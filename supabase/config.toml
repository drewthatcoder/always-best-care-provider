# Always Best Care provider portal
# Versions Stripe Connect Edge Functions for hosted project uwgfitnpesgdkiwtekcb.
# Stripe mode follows STRIPE_SECRET_KEY (sk_live_ vs sk_test_).

project_id = "uwgfitnpesgdkiwtekcb"

[functions.create-connected-account]
verify_jwt = true

[functions.create-account-link]
verify_jwt = true

[functions.sync-connect-status]
verify_jwt = true

[functions.stripe-connect-webhook]
verify_jwt = false

# Mobile BookingScreen sends the anon JWT, not a provider user JWT.
# New actions (preview, complete_and_charge) check the provider user JWT in code.
[functions.charge-client]
verify_jwt = false

# QA-only charge. Same shared module, STRIPE_TEST_SECRET_KEY, QA allowlist.
[functions.charge-client-test]
verify_jwt = false

# Client card on file. create-setup-intent uses stripe-version for the ephemeral key
# and falls back to the pinned API version when the header is absent.
[functions.create-setup-intent]
verify_jwt = false

[functions.set-default-payment-method]
verify_jwt = false

[functions.get-payment-method]
verify_jwt = false

[functions.create-setup-intent-test]
verify_jwt = false

[functions.set-default-payment-method-test]
verify_jwt = false

[functions.get-payment-method-test]
verify_jwt = false

# AdminApplications sends the admin user JWT. The function checks admin role itself.
[functions.notify-provider-status]
verify_jwt = false

# Register.tsx sends the anon JWT after paid signup. The function emails the agreement via Resend.
[functions.submit-provider-application]
verify_jwt = false

# Public /pricing-form link from email. Optional user JWT; the function resolves user_id itself.
[functions.submit-service-pricing]
verify_jwt = false
